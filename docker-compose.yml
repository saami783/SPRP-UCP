services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    image: sprp-ucp-mysql
    restart: unless-stopped
    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sols_rp}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./${DB_IMPORT_DUMP:-fearandrespect.sql}:/docker-entrypoint-initdb-src/source.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-laravel}
      PMA_PASSWORD: ${DB_PASSWORD:-laravel}
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
      PMA_ABSOLUTE_URI: http://localhost:${DOCKER_PHPMYADMIN_PORT:-8081}/
    ports:
      - "${DOCKER_PHPMYADMIN_PORT:-8081}:80"

volumes:
  mysql_data:
  app_storage:
  app_cache:
